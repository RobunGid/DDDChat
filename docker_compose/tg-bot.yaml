services:
  telegram-bot:
    build:
      context: ..
      dockerfile: tg_bot/Dockerfile
    container_name: telegram-bot
    command: "debugpy --listen 5678 -m main"
    restart: always
    environment:
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:?}
      WEB_API_BASE_URL: ${WEB_API_BASE_URL:?}
      KAFKA_URL: ${KAFKA_URL:?} 
      MONGO_DB_CONNECTION_URI: ${MONGO_DB_CONNECTION_URI:?}
      TELEGRAM_SUPPORT_GROUP_ID: ${MONGO_DB_CONNECTION_URI:?}
      DATABASE_NAME: ${DATABASE_NAME:?}
    networks:
      - backend
    volumes:
      - ../tg_bot/:/app/
    ports:
      - "5676:5678"
      
  sqliteweb:
    image: tomdesinto/sqliteweb
    ports:
      - 8080:8080
    volumes:
      - ../tg_bot:/db
    command: ${DATABASE_NAME:?}

networks:
  backend:
    driver: bridge