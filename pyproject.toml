[project]
name = "dddchat"
version = "0.1.0"
description = ""
authors = [
    {name = "Robun Gid"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[httpx] (>=0.136.3,<0.137.0)",
    "motor (>=3.7.1,<4.0.0)",
    "uvicorn[all] (>=0.48.0,<0.49.0)",
    "ipython (>=9.13.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "aiokafka (>=0.14.0,<0.15.0)",
    "orjson (>=3.11.9,<4.0.0)",
    "websockets (>=16.0,<17.0)",
    "aiojobs (>=1.4.0,<2.0.0)",
    "punq (>=0.7.0,<0.8.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile="black"
line_length=120
lines_between_sections=1
lines_between_types=0
force_alphabetical_sort_within_sections=true
ensure_newline_before_comments=true
combine_as_imports=true
combine_star=true
skip_gitignore=true
src_paths=["core", ]
skip_glob=[
    ".git",
    ".idea",
    ".vscode",
    "venv",
    ".venv",
]
known_fastapi=["fastapi","starlette "]
known_first_party=["application","domain","infrastructure","logic","settings","tests"]
sections=[
    "FUTURE",
    "STDLIB",
    "FASTAPI",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
[dependency-groups]
dev = [
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "faker (>=40.20.0,<41.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "pytest (>=9.0.3,<10.0.0)"
]

[tool.ruff]
src=["./app"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4

target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false

line-ending = "auto"

docstring-code-format = false

docstring-code-line-length = "dynamic"

[tool.black]
line-length = 120