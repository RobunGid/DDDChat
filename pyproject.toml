[project]
name = "dddchat"
version = "0.1.0"
description = ""
authors = [
    {name = "Robun Gid"}
]
requires-python = "^3.11"
dependencies = [
    "fastapi[httpx] (>=0.136.3,<0.137.0)",
    "motor (>=3.7.1,<4.0.0)",
    "uvicorn[all] (>=0.48.0,<0.49.0)",
    "ipython (>=9.13.0,<10.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "faker (>=40.19.1,<41.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "punq (>=0.7.0,<0.8.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "aiokafka (>=0.14.0,<0.15.0)",
    "orjson (>=3.11.9,<4.0.0)",
    "websockets (>=16.0,<17.0)",
    "aiojobs (>=1.4.0,<2.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile="black"
line_length=120
lines_between_sections=1
lines_between_types=0
force_alphabetical_sort_within_sections=true
ensure_newline_before_comments=true
combine_as_imports=true
combine_star=true
skip_gitignore=true
src_paths=["core", ]
skip_glob=[
    ".git",
    ".idea",
    ".vscode",
    "venv",
    ".venv",
]
known_fastapi=["fastapi","starlette "]
known_first_party=["application","domain","infrastructure","logic","settings","tests"]
sections=[
    "FUTURE",
    "STDLIB",
    "FASTAPI",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]